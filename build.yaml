# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "dabase_v2_left", "dabase_v2_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: dabase_v2_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: dabase_v2_left_with_studio
#
---
include:
  - board: xiao_ble//zmk
    shield: dabase_v2_dongle
    snippet: zmk-usb-logging
    artifact-name: dabase_v2_dongle-usb-log
  - board: xiao_ble//zmk
    shield: dabase_v2_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: dabase_v2_dongle_with_studio
  - board: nice_nano//zmk
    shield: dabase_v2_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=30000
    snippet: zmk-usb-logging
    artifact-name: dabase_v2_left
  - board: nice_nano//zmk
    shield: dabase_v2_right
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
    snippet: zmk-usb-logging
    artifact-name: dabase_v2_right-promini-i2c
  - board: nice_nano//zmk
    shield: dabase_v2_right
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_ZMK_EXT_POWER=n
    snippet: zmk-usb-logging
    artifact-name: dabase_v2_right-promini-i2c-poweroff
  - board: nice_nano//zmk
    shield: dabase_v2_right
    snippet: zmk-usb-logging
    artifact-name: dabase_v2_right-standalone-usb

  - board: nice_nano//zmk
    shield: settings_reset
  - board: xiao_ble//zmk
    shield: settings_reset

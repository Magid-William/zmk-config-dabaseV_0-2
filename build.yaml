# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "dabase_v2_right", "dabase_v2_left" ]
# include:
#   - board: nice_nano
#     shield: dabase_v2_right
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: dabase--v2_right_with_studio
#
---
include:
  # Right half: split central (no dongle). Talks to the host over BLE or USB,
  # owns the Azoteq TPS43 touchpad (I2C0) and forwards to the left half.
  - board: nice_nano
    shield: dabase_v2_right
    # Idle cut for the pad's power rail: ZMK goes IDLE 5 s after the last key
    # or pointer event, and drivers/input/tps43_power_policy.c cuts the rail
    # then. Deep sleep still follows ZMK_IDLE_SLEEP_TIMEOUT (1 h).
    cmake-args: -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_TIMEOUT=5000 -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
    # Exp80: USB logging/shell on the right half to capture PS/2 drops.
    snippet: zmk-usb-logging
    artifact-name: dabase--v2_right-central

  # Left half: split peripheral only (no central role, no dongle).
  - board: nice_nano
    shield: dabase_v2_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=5400000
    # Exp78: no zmk-usb-logging snippet -> log/shell off on the battery half.
    artifact-name: dabase--v2_left-peripheral

  - board: nice_nano
    shield: settings_reset

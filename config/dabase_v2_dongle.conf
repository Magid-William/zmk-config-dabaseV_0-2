CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_INPUT_LISTENER=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_INIT_PRIORITY=60
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_BT_SHELL=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# zmk-battery-center (https://github.com/kot149/zmk-battery-center):
# the dongle is the split central — fetch the left/right battery levels
# over the split BLE links and expose them on the dongle's own Battery
# Service so the desktop app shows all three devices.
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Always-on: no automatic deep sleep (halves no longer sleep on a timeout).
# Sleep is manual only, via the soft-off combos in the keymap.
CONFIG_ZMK_SLEEP=n
# Enables the &soft_off behavior used by the sleep combos (Q+P / ;+L).
# With kscan0 in soft_off_wakers (dabase_v2.dtsi) a key press wakes the half.
CONFIG_ZMK_PM_SOFT_OFF=y
# CONFIG_PM_DEVICE=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
# For split keyboards:
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

CONFIG_ZMK_MOUSE=y

#Bluetooth settings
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_GPIO=y

# PS/2 Trackpoint Driver - Stream-Only Mode
# This obscure trackpoint IC rejects all host commands and starts
# streaming immediately on power-up. No init sequence needed.
CONFIG_ZMK_INPUT_MOUSE_PS2_STREAM_ONLY=y
CONFIG_ZMK_INPUT_MOUSE_PS2_ENABLE_ERROR_MITIGATION=y
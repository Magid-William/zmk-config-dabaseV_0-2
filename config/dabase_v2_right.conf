# Exp82: no dongle - the right half is the split central. Give it a distinct
# name so hosts do not confuse it with the other board already paired.
CONFIG_ZMK_KEYBOARD_NAME="dabase--v2"

# Exp82: this half now owns the BLE links (host + left peripheral). The
# retired dongle enabled ZMK's planned connection-stability defaults; keep
# them on the new central.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# ble-azoteq-tps43: Azoteq TPS43 trackpad on I2C0 (SDA D2/P0.17,
# SCL D3/P0.20). Driver is vendored in drivers/input (beekeeb
# zmk_driver_azoteq @ c329f30) and patched to poll: RDY is not routed on
# this PCB, so the pad is read on a timer instead of an interrupt.
CONFIG_INPUT_TPS43=y
CONFIG_I2C=y
CONFIG_INPUT_TPS43_POLL_INTERVAL_MS=10

# exp/tps43-trackpoint: read ABS_X/Y and turn the offset from the landing
# point into velocity, but only on layer 6 (the hold-J scroll layer). Normal
# layers keep the ordinary relative trackpad pointer.
# Tune live over COM8:
#   tps43_tp status
#   tps43_tp mode off
#   tps43_tp layer 6
#   tps43_tp deadzone_mm 1.5
#   tps43_tp radius_mm 10
#   tps43_tp speed 1000
#   tps43_tp exp 200
#   tps43_tp diag on
CONFIG_INPUT_TPS43_TRACKPOINT=y

# Cut the pad's VCC rail when ZMK goes idle (CONFIG_ZMK_IDLE_TIMEOUT = 60 s,
# from build.yaml) and restore it on the next key press or USB connection.
# The pad reboots and is reconfigured 800 ms later; the first touch after a
# cut does nothing until a key wakes it, exactly like the TrackPoint build.
CONFIG_INPUT_TPS43_POWER_POLICY=y
CONFIG_INPUT_TPS43_POLL_IDLE_INTERVAL_MS=20

# BLE pointer smoothness: ask the host for the shortest connection interval
# with no slave latency, so HID notifications are paced at 7.5 ms instead of
# the ZMK defaults (7.5-15 ms with latency 30). Latency 30 lets the link skip
# up to 30 events when the peripheral has nothing to send, which shows up as
# stutter on pointer movement.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

CONFIG_INPUT=y
CONFIG_ZMK_INPUT_LISTENER=y
CONFIG_ZMK_POINTING=y
# Exp82: carried over from the retired dongle build so the scroll layer keeps
# its smooth-scrolling feel now that the central lives on the right half.
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Bring-up: driver INFO logs (handshake, config writes, per-event movement)
# plus the I2C shell so `i2c read i2c@40003000 74 0000 02` can probe the pad.
CONFIG_INPUT_LOG_LEVEL_INF=y
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_GPIO_SHELL=y
CONFIG_I2C_SHELL=y
# Bring-up: inspect/repair persisted settings (e.g. a stale ext_power off
# state left behind by the PS/2 build).
CONFIG_SETTINGS_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_CMDS=y
# Bring-up: print from the first boot message instead of after 8 s, so the
# driver's init sequence is not lost when the buffer is full.
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=0

# Exp70: crash diagnostics on the right half. MPU stack guard stays
# default-on so a thread overflow = named HARD FAULT.
CONFIG_FAULT_DUMP=2
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=n
CONFIG_DEBUG_THREAD_INFO=y

# Exp70 it6 - the Zephyr input core processes every pointer event in its
# dedicated `input` thread (default 1024). The registered callbacks
# (listener -> HID, split BLE transport) run there. 4096 + a bigger queue.
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_INPUT_QUEUE_MAX_MSGS=64

# Exp70 iteration 2: the system workqueue also runs input_process ->
# zmk,input-split -> bt_gatt_notify inline. Give it headroom.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Exp70 it5: thread-stack evidence showed the output threads exhausted.
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048

# libc (verified with this module - avoids picolibc symbol conflicts)
CONFIG_PICOLIBC=n
CONFIG_NEWLIB_LIBC=y

# zmk-battery-center (https://github.com/kot149/zmk-battery-center):
# Exp82: the right half is the split central now that the dongle is gone
# (paired to the PC over BLE or USB) - fetch the left half battery over the
# split BLE link and expose it on this side's own Battery Service so the
# desktop app shows both halves. No-ops on peripheral-role builds of this
# shield.
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# CONFIG_INPUT_TPS43_RAW_DIAG=y

# Exp69 fresh: direct PS/2 trackpoint (gpio-ps2, no ATtiny/Pro Mini)
CONFIG_PS2=y
CONFIG_PS2_GPIO=y
CONFIG_PS2_UART=n

# Exp68/69: never send any PS/2 command (this trackpoint rejects all of them).
# Error mitigation stays OFF: its overflow checks run on the garbled status
# byte and drop valid packets.
CONFIG_ZMK_INPUT_MOUSE_PS2_NO_HOST_COMMANDS=y

# Exp70: suppress the gpio-ps2 backend's internal 0xFE resend writes too
# (defaults on with NO_HOST_COMMANDS; explicit for clarity). This TP never
# ACKs a resend, so every attempt inhibits CLK and times out mid-stream.
CONFIG_PS2_GPIO_NO_RESEND=y

# pr/optional-features refactor: settings that were hardcoded in the fork are
# now opt-in Kconfig. Restore the Exp74 behavior explicitly.
CONFIG_PS2_GPIO_INTERNAL_PULLUP=y
CONFIG_PS2_GPIO_TIMING_SCL_CYCLE_MAX=8000
CONFIG_PS2_GPIO_WORK_QUEUE_CB_STACK_SIZE=4096
CONFIG_ZMK_INPUT_MOUSE_PS2_POWER_CURVE=y
CONFIG_ZMK_INPUT_MOUSE_PS2_TELEMETRY=y

# Exp81: trackpoint rail power policy. EXT_POWER is cut when ZMK reaches its
# idle state (CONFIG_ZMK_IDLE_TIMEOUT = 60 s, from build.yaml) and re-armed on
# the next activity edge; CLK/DAT are set to GPIO_DISCONNECTED with the rail so
# the internal pull-ups cannot leak into the unpowered module, and that pin
# state survives into deep sleep. The 800 ms mute covers this TP's 600 ms +-20%
# power-on plus its 1-2 garbage first packets (Exp06).
CONFIG_ZMK_PS2_TP_POWER_POLICY=y
CONFIG_ZMK_PS2_TP_POWER_BOOT_MUTE_MS=800

# The gpio-ps2 backend decodes cleanly, so the UART-era anti-glitch filters
# (EMA/median/slew) are OFF - they would only add lag. Kconfig-gated, default off.
CONFIG_ZMK_INPUT_MOUSE_PS2_MEDIAN_WINDOW=1
CONFIG_ZMK_INPUT_MOUSE_PS2_SLEW_MAX=0
CONFIG_ZMK_INPUT_MOUSE_PS2_MOVEMENT_EMA_N=1

# Exp77: single-packet magnitude jump filter. A spurious packet that slips
# past the decode checks carries an absurd per-packet delta; reject deltas
# above this and replay the last accepted value (cursor holds, no leap).
# NOTE: this also clips genuine single fast flicks - tune down if flicking
# feels clipped, or switch to the SLEW_MAX "sustained" exemption instead.
CONFIG_ZMK_INPUT_MOUSE_PS2_DELTA_MAX=50

# Exp68 final speed: divisor 1 = raw stream (user-confirmed "Perfect").
CONFIG_ZMK_INPUT_MOUSE_PS2_SPEED_DIVISOR=1

CONFIG_INPUT=y
CONFIG_ZMK_INPUT_LISTENER=y
CONFIG_ZMK_POINTING=y

# Exp80: debug back on the right half to capture PS/2 byte drops.
# The battery cost is accepted for this experiment; the left half stays
# logging-free (Exp79). The zmk-usb-logging snippet is on this build in
# build.yaml; LOG_BACKEND_UART is what actually routes the log framework to
# the USB CDC console. LOG_PRINTK stays OFF (known silent-console trap), and
# per-byte DBG levels stay off (Exp70: log spam starves the workers).
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_GPIO_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_CMDS=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000

# Exp80: a lost byte (parity/stop/timing) now tells the packet assembler to
# drop the partial packet and hold movement until the 3-byte phase is proven.
CONFIG_ZMK_INPUT_MOUSE_PS2_HOLD_ON_DROP=y

# Exp70: crash diagnostics on the right half - F1/F2 fix commits went in, so
# the fault dump + thread analyzer are there to catch anything that remains.
# MPU stack guard stays default-on so a thread overflow = named HARD FAULT.
CONFIG_FAULT_DUMP=2
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=n
CONFIG_DEBUG_THREAD_INFO=y

# Exp70 iteration 2 (crash returned despite F1/F2): the real overloaded
# thread is the SYSTEM workqueue - input_process -> zmk,input-split ->
# bt_gatt_notify inline runs there (ZMK service.c notifies position/sensor
# events from a dedicated queue thread, but INPUT events notify inline from
# system_t). Give it headroom + cap the report flood.
# (No ZMK_WATCHDOG at this SHA - drops it; FAULT_DUMP/THREAD_ANALYZER stay.)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_INPUT_MOUSE_PS2_REPORT_INTERVAL_MIN=5

# Exp70 it5: thread-stack evidence (kernel thread stacks, idle):
#   HID Over GATT Send Work   768/768 at 100% <- MAXED
#   Low Priority Work Queue   768/768 at 100% <- MAXED
#   (usbd_workq 956/1024 at 93% - no KSET symbol at this Zephyr, skip)
# A ZMK-thread stack overflow (memory corruption) is the death mechanism that
# survived every decoder fix - it lives in the OUTPUT threads, not the ps2
# decoder. Raise the observed exhausted stacks.
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048
# Note: ZMK_SPLIT_BLE_PERIPHERAL_STACK_SIZE is peripheral-role only; it lives in
# build.yaml cmake-args for the ps2-direct build (setting it here breaks the
# central-role standalone build). CONFIG_USB_DEVICE_WORKQUEUE_STACK_SIZE does not
# exist at this Zephyr, so usbd_workq stays at default.

# Exp70 it6 - THE crash thread: Zephyr input core processes every pointer event
# in its dedicated `input` thread (CONFIG_INPUT_THREAD_STACK_SIZE default 1024).
# The registered callbacks (zmk,input-split -> split BLE transport ->
# bt_gatt_notify, or listener -> HID) run THERE - deep chains on a 1KB stack.
# First TP event overflows -> silent whole-half death in every build/topology.
# 4096 + a bigger queue for the high-rate trackpoint stream.
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_INPUT_QUEUE_MAX_MSGS=64

# libc (verified with this module - avoids picolibc symbol conflicts)
CONFIG_PICOLIBC=n
CONFIG_NEWLIB_LIBC=y

# zmk-battery-center (https://github.com/kot149/zmk-battery-center):
# the right half is the default split central for the non-dongle topology
# (paired to the PC over BLE) - fetch the left half battery over the split
# BLE link and expose it on this side's own Battery Service so the desktop
# app shows both halves. No-ops on peripheral-role builds of this shield.
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

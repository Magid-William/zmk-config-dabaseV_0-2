# Exp69 fresh: direct PS/2 trackpoint (gpio-ps2, no ATtiny/Pro Mini)
CONFIG_PS2=y
CONFIG_PS2_GPIO=y
CONFIG_PS2_UART=n

# Exp68/69: never send any PS/2 command (this trackpoint rejects all of them).
# Error mitigation stays OFF: its overflow checks run on the garbled status
# byte and drop valid packets.
CONFIG_ZMK_INPUT_MOUSE_PS2_NO_HOST_COMMANDS=y

# Exp70: suppress the gpio-ps2 backend's internal 0xFE resend writes too
# (defaults on with NO_HOST_COMMANDS; explicit for clarity). This TP never
# ACKs a resend, so every attempt inhibits CLK and times out mid-stream.
CONFIG_PS2_GPIO_NO_RESEND=y

# The gpio-ps2 backend decodes cleanly, so the UART-era anti-glitch filters
# (EMA/median/slew) are OFF - they would only add lag. Kconfig-gated, default off.
CONFIG_ZMK_INPUT_MOUSE_PS2_MEDIAN_WINDOW=1
CONFIG_ZMK_INPUT_MOUSE_PS2_SLEW_MAX=0
CONFIG_ZMK_INPUT_MOUSE_PS2_MOVEMENT_EMA_N=1

# Exp68 final speed: divisor 1 = raw stream (user-confirmed "Perfect").
CONFIG_ZMK_INPUT_MOUSE_PS2_SPEED_DIVISOR=1

CONFIG_INPUT=y
CONFIG_ZMK_INPUT_LISTENER=y
CONFIG_ZMK_POINTING=y

CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_GPIO_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y

# Bring-up debugging (Exp69): watch packet decode + input reports on the wire
CONFIG_PS2_LOG_LEVEL_DBG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000

# Exp70: crash diagnostics on the right half - F1/F2 fix commits went in, so
# the fault dump + thread analyzer are there to catch anything that remains.
# MPU stack guard stays default-on so a thread overflow = named HARD FAULT.
CONFIG_FAULT_DUMP=2
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=n
CONFIG_DEBUG_THREAD_INFO=y

# Exp70 iteration 2 (crash returned despite F1/F2): the real overloaded
# thread is the SYSTEM workqueue - input_process -> zmk,input-split ->
# bt_gatt_notify inline runs there (ZMK service.c notifies position/sensor
# events from a dedicated queue thread, but INPUT events notify inline from
# system_t). Give it headroom + cap the report flood.
# (No ZMK_WATCHDOG at this SHA - drops it; FAULT_DUMP/THREAD_ANALYZER stay.)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_INPUT_MOUSE_PS2_REPORT_INTERVAL_MIN=5

# Exp70 iteration 3 (user: LOG, not theorize): make log output actually
# visible. zmk-usb-logging uses a deferred log processing thread that has
# never rendered anything on this build; immediate mode prints straight to
# the CDC console from thread context. Pairs with the driver's 1s
# state-machine telemetry lines.
CONFIG_LOG_MODE_IMMEDIATE=y

# libc (verified with this module - avoids picolibc symbol conflicts)
CONFIG_PICOLIBC=n
CONFIG_NEWLIB_LIBC=y
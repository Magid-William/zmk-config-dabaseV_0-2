manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: maged
      url-base: https://github.com/Magid-William
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: te9no
      url-base: https://github.com/te9no
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: ac7f75b8
      import: app/west.yml

    # Exp70: direct PS/2 on the right half (gpio-ps2 backend,
    # NO_HOST_COMMANDS). Driver Exp70 = +4096 cb-workqueue stack + no-resend +
    # per-axis report-interval accumulator fix + it3 printk stream + it4
    # read-timeout off the system workqueue + ISR-safe logging + it4c 8ms
    # clock-pause tolerance (this TP pauses mid-byte; AVR needed 7.5ms).
    # Exp74: + on-device PowerCurve (curve-sens/rate/exponent/start DT props).
    # Exp77: + single-packet magnitude jump filter
    # (ZMK_INPUT_MOUSE_PS2_DELTA_MAX, on via dabase_v2_right.conf).
    - name: zmk-ps2-trackpoint-driver
      remote: maged
      revision: 75d4d719c7702a419b2750194cabda636cd3969b

    - name: zmk-behavior-battery-percentage-printer
      remote: badjeff
      revision: main

    # Exp73: hold K -> trackpoint tilt becomes volume via te9no's
    # keybind input-processor (Exp51 pattern). The keybind_volume node is
    # defined inline in the dongle overlay (NOT via the module's dtsi,
    # which pulls a missing dt-bindings header).
    - name: zmk-input-processor-keybind
      remote: te9no
      revision: main
  self:
    path: config